# Local only: serves the static files and proxies /api to the api container,
# so the browser sees a single origin. In Azure, Blob Storage serves the files
# and the browser calls the Container App directly (CORS).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
