<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Cloud Notes</h1>
      <p id="message" class="muted">Connecting to the API…</p>
    </header>

    <form id="note-form">
      <input id="note-text" name="text" maxlength="500" placeholder="Write a note" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <p id="error" class="error" hidden></p>

    <ul id="notes"></ul>

    <footer class="muted">
      Frontend: Blob Storage static website · API: Container Apps · Data: Azure Database for PostgreSQL
      <br>API version: <code id="version">?</code>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
