# Local run of all three services: docker compose up --build
# Needs a .env file next to this one (copy .env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://notes:${POSTGRES_PASSWORD}@db:5432/notes
      APP_MESSAGE: Hello from Docker Compose
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "3000:8080"

volumes:
  dbdata:
