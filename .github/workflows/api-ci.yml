# CI for the API: test -> build image -> push to Docker Hub, tagged with the commit SHA.
# Optional CD: if the AZURE_* repository variables exist, also deploy to Container Apps.
#
# Repository settings needed (Settings -> Secrets and variables -> Actions):
#   Variables: DOCKERHUB_USERNAME
#   Secrets:   DOCKERHUB_TOKEN   (Docker Hub personal access token, Read & Write)
#   Optional deploy variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#                              AZURE_RESOURCE_GROUP, AZURE_CONTAINER_APP
name: api-ci

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-ci.yml"]
  pull_request:
    paths: ["api/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/notes-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: GitHub gets a short-lived token, no Azure password stored
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy new revision
        run: |
          az containerapp update \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_CONTAINER_APP }}" \
            --image "${{ env.IMAGE }}:${{ github.sha }}"
      - name: Smoke test
        run: |
          FQDN=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_CONTAINER_APP }}" \
                 --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 20); do
            if curl -fsS "https://$FQDN/api/message" | grep -q "${{ github.sha }}"; then
              echo "New version is live"; exit 0
            fi
            sleep 10
          done
          echo "New version did not become live in time"; exit 1
